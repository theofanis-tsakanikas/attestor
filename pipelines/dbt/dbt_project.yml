# The transformation layer between raw evidence and the tables a disclosure resolves through.
#
# The load-bearing idea here is `store_failures`. Every data-contract test writes the rows it
# rejected into a table rather than just printing a count, and `gold.quarantine` unions them
# with the rule each row violated. That is what makes `E_UPSTREAM_QUARANTINE` a real answer:
# the resolver can say "this figure was computed over incomplete data" *and* point at the
# rows that were left out and why.
#
# A pipeline that drops bad rows silently produces a figure that is smaller than the truth
# and looks perfectly clean.

name: attestor
version: "1.0.0"
config-version: 2
profile: attestor

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

models:
  attestor:
    +materialized: table
    +file_format: iceberg
    staging:
      # Views: staging is a rename-and-cast layer, and materialising it would double storage
      # for no query anybody runs.
      +materialized: view
    gold:
      +materialized: incremental
      +incremental_strategy: merge

seeds:
  attestor:
    +schema: ref

tests:
  attestor:
    # Every rejected row is kept. This is the whole quarantine mechanism.
    +store_failures: true
    +schema: quarantine

# `store_failures` writes one table per test. The quarantine model needs them as one relation,
# and dbt has no built-in union of "every table in a schema" — so the hook below builds the
# view after every run, from the tests that actually ran.
on-run-end:
  - "{{ attestor.build_quarantine_view(results) }}"
