# The only way anything reaches AWS.
#
# `workflow_dispatch` only, behind a GitHub Environment whose reviewers must approve. The
# OIDC trust in infra/bootstrap is scoped to that environment, so a workflow that has not
# been approved cannot mint credentials at all — the gate is in IAM, not in a job condition
# somebody can edit.
#
# `days` has no default. Standing the estate up requires saying how long it is meant to live,
# and that answer becomes the `attestor:expires-at` tag the reaper enforces.
#
# The order below is forced by two things, and pretending otherwise is how a deploy fails at
# minute forty:
#
#   - ECR is created by the agent layer, so the image cannot be built before that layer
#     applies; AgentCore Runtime then needs the image. The agent layer therefore applies
#     twice — once without the runtime, once with it.
#   - The lake must contain data before a report runs. An estate that stands up and resolves
#     against empty tables behaves perfectly correctly and produces nothing, which looks
#     exactly like a broken deploy and is far harder to diagnose.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      days:
        description: How many days this estate should live (drives attestor:expires-at)
        required: true
        type: string
      stage:
        description: How far to go
        type: choice
        options: [foundation, data, knowledge, agent, full]
        default: full
      production_topology:
        description: OpenSearch standby replicas — on for the capture run only
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  PROJECT: attestor
  TF_INPUT: "false"
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ${{ vars.AWS_REGION }}
  ATTESTOR_WORKGROUP: attestor
  ATTESTOR_DATABASE: attestor_gold
  ATTESTOR_RAW_DATABASE: attestor_raw

jobs:
  validate:
    # The same gates a pull request runs, re-run on the exact ref being deployed. A green
    # check on a branch is not evidence about the commit somebody typed into a dispatch box.
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: show the identity this job will present
        # `Not authorized to perform sts:AssumeRoleWithWebIdentity` is the same message for a
        # wrong repository, a wrong environment, a wrong audience and a missing provider. It
        # names none of them. Printing the claims the token actually carries turns that into a
        # comparison anyone can make against the trust policy in `infra/bootstrap`.
        #
        # Only the identity fields are printed. The token itself is a credential and stays out
        # of the log.
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(printf '%s' "$token" | cut -d. -f2)
          case $(( ${#payload} % 4 )) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac
          printf '%s' "$payload" | tr '_-' '/+' | base64 -d \
            | jq '{sub, aud, repository, environment, ref, job_workflow_ref}'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/attestor-github-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: resolve the backend from the account
        # Everything except the account id is a consequence of names `infra/bootstrap`
        # already chose, so it is read from that layer rather than transcribed into
        # repository configuration. A value copied by hand looks like an independent
        # setting; a renamed bucket then becomes a deploy that fails on a backend nobody
        # can find, and the fix is in a settings page rather than in a diff.
        run: |
          set -euo pipefail
          read_param() {
            aws ssm get-parameter --name "/$PROJECT/bootstrap/$1" \
              --query 'Parameter.Value' --output text
          }
          {
            echo "TF_STATE_BUCKET=$(read_param state_bucket)"
            echo "TF_LOCK_TABLE=$(read_param lock_table)"
          } >> "$GITHUB_ENV"
          echo "backend resolved from /$PROJECT/bootstrap/*"


      - name: ensure an AWS CLI that knows AgentCore
        # `bedrock-agentcore-control` is a recent service and the runner image's bundled CLI
        # may predate it. Checking here costs seconds; discovering it inside the agent apply
        # costs the whole run, because the expensive layers are already standing by then.
        run: |
          set -euo pipefail
          if ! aws bedrock-agentcore-control help >/dev/null 2>&1; then
            echo "runner CLI ($(aws --version 2>&1)) predates bedrock-agentcore-control; upgrading"
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp
            sudo /tmp/aws/install --update
          fi
          aws --version
          aws bedrock-agentcore-control help >/dev/null

      - name: compute expiry
        id: expiry
        # `days` reaches the shell as an environment variable, never as `${{ }}` inside the
        # script. A dispatch input interpolated directly into a `run:` block is executed by
        # the shell before bash ever sees it as a value — the standard GitHub Actions script
        # injection, and not a shape this repository should contain.
        env:
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          case "$DAYS" in
            ''|*[!0-9]*) echo "days must be a positive integer, got '$DAYS'" >&2; exit 1 ;;
          esac
          echo "date=$(date -u -d "+$DAYS days" +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - run: pip install -e ".[dev,cloud]"

      - name: generate the MCP tool schema
        # Terraform reads this file to configure the gateway target. Regenerating it here
        # rather than trusting the commit means a tool added to `SPECS` cannot reach the
        # estate as a handler the Gateway never exposes. CI already fails on drift; this is
        # the belt to that pair of braces.
        run: attestor gateway spec --check

      - name: package the tool lambda
        # Vendors the library and the declarative material beside the handler so terraform's
        # archive_file has something to zip. A committed zip would drift from its source,
        # invisibly.
        run: make package

      - uses: docker/setup-qemu-action@v3
        if: contains(fromJSON('["agent","full"]'), inputs.stage)
      - uses: docker/setup-buildx-action@v3
        if: contains(fromJSON('["agent","full"]'), inputs.stage)

      - name: build the agent image
        if: contains(fromJSON('["agent","full"]'), inputs.stage)
        # Before any infrastructure, because nothing about building this image depends on
        # infrastructure. Only the *push* needs ECR, and ECR is created by the agent layer.
        #
        # Building it late is how a missing `COPY LICENSE` became a failure forty minutes in,
        # with OpenSearch Serverless already standing and metered. The build costs two minutes
        # and it costs them whether it succeeds or not; paying them first means a broken
        # Dockerfile stops a deploy before the deploy has spent anything.
        #
        # `--provenance=false` because `--load` has to hand the result to the classic image
        # store, and a build that emits attestations produces a manifest list that older
        # dockers refuse to load. The image is built from a pinned base and a locked
        # dependency set in a workflow whose ref is recorded; the attestation is not what
        # makes it traceable.
        run: |
          docker buildx build --platform linux/arm64 --provenance=false \
            -t "attestor-agent:${{ github.sha }}" --load .

      # ── Infrastructure ────────────────────────────────────────────────────

      - name: apply foundation
        env:
          TF_VAR_expires_at: ${{ steps.expiry.outputs.date }}
        run: ./.github/scripts/tf.sh apply foundation

      - name: apply data
        if: inputs.stage != 'foundation'
        env:
          TF_VAR_expires_at: ${{ steps.expiry.outputs.date }}
        run: ./.github/scripts/tf.sh apply data

      - name: apply knowledge
        if: contains(fromJSON('["knowledge","agent","full"]'), inputs.stage)
        env:
          TF_VAR_expires_at: ${{ steps.expiry.outputs.date }}
          TF_VAR_production_topology: ${{ inputs.production_topology }}
        run: ./.github/scripts/tf.sh apply knowledge

      - name: apply agent without the runtime
        if: contains(fromJSON('["agent","full"]'), inputs.stage)
        # Creates ECR, the gateway, the policy engine and memory. The runtime is held back
        # because it needs an image that does not exist yet.
        env:
          TF_VAR_expires_at: ${{ steps.expiry.outputs.date }}
          TF_VAR_deploy_runtime: "false"
        run: ./.github/scripts/tf.sh apply agent

      # ── Data ──────────────────────────────────────────────────────────────

      - name: seed the lake
        if: inputs.stage != 'foundation'
        # `--check` first. The generator refuses to write if any total drifts from the
        # recordings, which is the invariant keeping offline and live the same program.
        run: |
          set -euo pipefail
          python pipelines/seed/generate.py --check
          python pipelines/seed/generate.py --out build/seed
          LAKE=$(terraform -chdir=infra/foundation output -raw lake_bucket)
          aws s3 sync build/seed "s3://$LAKE/raw/" --delete
          echo "seeded s3://$LAKE/raw/"

      - name: repair partitions
        if: inputs.stage != 'foundation'
        run: ./.github/scripts/athena.sh repair

      - name: dbt build
        if: inputs.stage != 'foundation'
        run: ./.github/scripts/dbt.sh

      - name: apply analytics views
        if: inputs.stage != 'foundation'
        run: ./.github/scripts/athena.sh views

      # ── Evidence ──────────────────────────────────────────────────────────

      - name: ingest evidence
        if: contains(fromJSON('["knowledge","agent","full"]'), inputs.stage)
        run: |
          set -euo pipefail
          EVIDENCE=$(terraform -chdir=infra/foundation output -raw evidence_bucket)
          python pipelines/ingest/evidence.py
          for tenant in helios aegis lumen; do
            aws s3 sync "evidence/$tenant" "s3://$EVIDENCE/$tenant/"
          done

      - name: ingest the regulatory corpus
        if: contains(fromJSON('["knowledge","agent","full"]'), inputs.stage)
        # Shared across tenants, under a prefix no tenant id can collide with. Without this
        # the regulatory knowledge base has nothing in it and `search_regulation` answers
        # every query with silence — which is what it did.
        run: |
          set -euo pipefail
          EVIDENCE=$(terraform -chdir=infra/foundation output -raw evidence_bucket)
          python pipelines/ingest/regulatory.py --check
          aws s3 sync corpus/regulatory "s3://$EVIDENCE/_shared/regulatory/" --delete

      - name: sync the knowledge bases
        if: contains(fromJSON('["knowledge","agent","full"]'), inputs.stage)
        run: ./.github/scripts/kb-sync.sh

      # ── The agent container ───────────────────────────────────────────────

      - name: push the agent image
        if: contains(fromJSON('["agent","full"]'), inputs.stage)
        # Tag and push what was already built. Re-running `buildx build` here would be nearly
        # free on a warm cache, but it would also mean the artefact that reaches ECR was built
        # from a second evaluation of the Dockerfile rather than from the one that was proved
        # to succeed before anything was spent.
        #
        # The tag is the commit sha and the repository's tags are immutable, which is the right
        # way round: an image tag that can be overwritten is a deployment nobody can reproduce.
        # It does mean re-deploying the same commit finds its own tag already there, and
        # `docker push` calls that an error — `tag invalid: ... cannot be overwritten`. It is
        # not one. Same commit, same image, nothing to do.
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          REPO=$(terraform -chdir=infra/agent output -raw ecr_repository_url)
          NAME=$(terraform -chdir=infra/agent output -raw ecr_repository_name)
          if aws ecr describe-images --repository-name "$NAME" \
               --image-ids "imageTag=$TAG" >/dev/null 2>&1; then
            echo "$REPO:$TAG is already in ECR; the tag is immutable and the commit has not"
            echo "changed, so there is nothing to push."
            exit 0
          fi
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${REPO%%/*}"
          docker tag "attestor-agent:$TAG" "$REPO:$TAG"
          docker push "$REPO:$TAG"
          echo "pushed $REPO:$TAG"

      - name: apply agent with the runtime
        if: inputs.stage == 'full'
        env:
          TF_VAR_expires_at: ${{ steps.expiry.outputs.date }}
          TF_VAR_deploy_runtime: "true"
          TF_VAR_agent_image_tag: ${{ github.sha }}
        run: ./.github/scripts/tf.sh apply agent

      # ── Prove it ──────────────────────────────────────────────────────────

      - name: run every tenant against the live estate
        if: inputs.stage == 'full'
        # A blocked tenant does not fail the deploy. `aegis` is *supposed* to block — its
        # Scope 1 misses its own cross-check — and a workflow that went red on a correct
        # refusal would teach everyone to ignore it.
        env:
          # Without this the run replays `recordings/` and prints PASS without touching
          # Athena — a deploy that appears to succeed while proving nothing. The same switch
          # now also chooses the narrative provider, so this step drafts against the real
          # model instead of replaying a captured draft.
          ATTESTOR_BACKEND: athena
        run: |
          set -uo pipefail
          export ATTESTOR_ATHENA_OUTPUT="s3://$(terraform -chdir=infra/foundation output -raw lake_bucket)/athena-results/"
          # The narrative provider needs the knowledge estate, and it asserts each of these
          # rather than defaulting: falling back to a recorded draft against a live estate
          # would publish captured prose as if a model had just written it.
          export ATTESTOR_EVIDENCE_KB="$(terraform -chdir=infra/knowledge output -raw evidence_kb_id)"
          export ATTESTOR_REGULATORY_KB="$(terraform -chdir=infra/knowledge output -raw regulatory_kb_id)"
          export ATTESTOR_GUARDRAIL_ID="$(terraform -chdir=infra/knowledge output -raw guardrail_id)"
          export ATTESTOR_GUARDRAIL_VER="$(terraform -chdir=infra/knowledge output -raw guardrail_version)"
          export ATTESTOR_REASONING_MODEL="$(terraform -chdir=infra/agent output -raw reasoning_model)"
          for tenant in helios aegis lumen; do
            attestor run --tenant "$tenant" --run-id "${{ github.run_id }}" || true
          done
          attestor dashboard

      - name: publish the results
        if: inputs.stage == 'full'
        run: |
          set -euo pipefail
          REPORTS=$(terraform -chdir=infra/foundation output -raw reports_bucket)
          aws s3 sync out "s3://$REPORTS/${{ github.run_id }}/"
          {
            echo "### Run complete"
            echo
            python .github/scripts/summarise.py
            echo
            echo "Expires \`${{ steps.expiry.outputs.date }}\` — run **Destroy** before then."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: inputs.stage == 'full'
        with:
          name: reports-${{ github.run_id }}
          path: out/
          retention-days: 14
