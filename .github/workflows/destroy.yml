# Tearing the estate down. Typed confirmation, reverse dependency order, and a check that it
# actually went.
#
# The last step matters more than it looks: a destroy that fails halfway leaves the most
# expensive layer standing while the summary says "completed". Confirming emptiness is how
# "we destroyed it" stops being something we believe and becomes something we checked.

name: Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DESTROY to confirm
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  PROJECT: attestor
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: check the typed confirmation
        # Through the environment, not through `${{ }}` inside the script. Interpolating a
        # free-text dispatch input into a `run:` block hands the shell whatever was typed —
        # and this is the workflow that deletes the estate, so it is the last place to be
        # relaxed about it.
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "DESTROY" ]; then
            echo "confirmation not given" >&2
            exit 1
          fi

  destroy:
    needs: confirm
    runs-on: ubuntu-latest
    environment: destroy
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/attestor-github-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: resolve the backend from the account
        # Everything except the account id is a consequence of names `infra/bootstrap`
        # already chose, so it is read from that layer rather than transcribed into
        # repository configuration. A value copied by hand looks like an independent
        # setting; a renamed bucket then becomes a deploy that fails on a backend nobody
        # can find, and the fix is in a settings page rather than in a diff.
        run: |
          set -euo pipefail
          read_param() {
            aws ssm get-parameter --name "/$PROJECT/bootstrap/$1" \
              --query 'Parameter.Value' --output text
          }
          {
            echo "TF_STATE_BUCKET=$(read_param state_bucket)"
            echo "TF_LOCK_TABLE=$(read_param lock_table)"
          } >> "$GITHUB_ENV"
          echo "backend resolved from /$PROJECT/bootstrap/*"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: ensure an AWS CLI that knows AgentCore
        # The agent layer detaches its gateway target through a destroy provisioner, and that
        # provisioner shells out to `bedrock-agentcore-control`. On a runner whose bundled CLI
        # predates the service the provisioner fails, the agent layer's destroy fails with it,
        # and the loop below stops — leaving OpenSearch Serverless, the single most expensive
        # thing in the estate, standing behind an error about a CLI.
        run: |
          set -euo pipefail
          if ! aws bedrock-agentcore-control help >/dev/null 2>&1; then
            echo "runner CLI ($(aws --version 2>&1)) predates bedrock-agentcore-control; upgrading"
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp
            sudo /tmp/aws/install --update
          fi
          aws bedrock-agentcore-control help >/dev/null

      - name: empty the buckets
        # Versioned buckets refuse to delete while they hold objects, and `force_destroy`
        # covers current versions only. A teardown that stops here leaves the lake — the
        # thing actually holding a tenant's data — standing.
        run: |
          set -uo pipefail
          terraform -chdir=infra/foundation init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="encrypt=true" >/dev/null
          for output in lake_bucket evidence_bucket reports_bucket; do
            bucket=$(terraform -chdir=infra/foundation output -raw "$output" 2>/dev/null) || continue
            echo "── emptying $bucket"
            aws s3api delete-objects --bucket "$bucket" --delete "$(aws s3api list-object-versions \
              --bucket "$bucket" --output json \
              --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}')" 2>/dev/null || true
            aws s3api delete-objects --bucket "$bucket" --delete "$(aws s3api list-object-versions \
              --bucket "$bucket" --output json \
              --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}')" 2>/dev/null || true
          done

      - name: drop the schemas dbt created
        # Terraform manages `attestor_gold` and `attestor_raw`. dbt creates one Glue database
        # per schema beside them — `attestor_gold_ref`, `attestor_gold_quarantine` — and
        # Terraform has never heard of those, so a clean `terraform destroy` left 45 tables
        # standing and reported success. Found by sweeping the account after a teardown that
        # said it had finished.
        #
        # Free, as it happens: the Data Catalog charges nothing for the first million objects.
        # Left behind anyway, they are the difference between "destroyed" and "destroyed except
        # the parts nobody was looking at".
        run: |
          set -euo pipefail
          for database in $(aws glue get-databases \
            --query "DatabaseList[?starts_with(Name, '$PROJECT')].Name" --output text); do
            case "$database" in
              "$PROJECT"_gold|"$PROJECT"_raw) continue ;;  # Terraform owns these
            esac
            echo "  dropping $database"
            aws glue delete-database --name "$database"
          done

      - name: destroy in reverse order
        id: destroy
        env:
          TF_VAR_expires_at: "1970-01-01"
          TF_VAR_deploy_runtime: "true"
        run: |
          set -euo pipefail
          for layer in agent knowledge data foundation; do
            echo "── $layer"
            # AgentCore attaches its own network interfaces into our private subnets, and it
            # releases them some minutes *after* the runtime and gateways are gone. They are
            # `ela-attach` interfaces owned by `amazon-aws`: not deletable, not detachable,
            # and enough to hold a subnet. Destroy 31189541492 spent 36 minutes retrying
            # `DeleteSubnet` against them and then failed on a DependencyViolation, leaving
            # the VPC standing — free, but standing, which is not what a teardown means.
            #
            # So the foundation layer waits for its own subnets to be empty first. Bounded:
            # if AWS has not released them in 20 minutes the destroy proceeds and fails
            # loudly, because a teardown that waits forever is a teardown nobody watches.
            if [ "$layer" = foundation ]; then
              ./.github/scripts/wait-for-empty-subnets.sh || true
            fi
            ./.github/scripts/tf.sh destroy "$layer"
          done

      - name: release any lock this run left behind
        if: always()
        # A destroy that dies mid-apply keeps its lock. The next run then fails with `Error
        # acquiring the state lock` and never touches the estate at all — which is how two
        # consecutive teardowns "failed on the ENIs" when the second had not started, and how a
        # NAT gateway billed for a night while both runs looked like the same known problem.
        #
        # Only a lock this workflow's own run created. `force-unlock` is otherwise exactly the
        # kind of thing that should need a human, and stealing a lock from a running apply is
        # worse than the stuck lock it fixes.
        run: |
          set -uo pipefail
          for layer in agent knowledge data foundation; do
            info=$(aws dynamodb get-item --table-name "$TF_LOCK_TABLE" \
              --key "{\"LockID\":{\"S\":\"$TF_STATE_BUCKET/$layer/terraform.tfstate\"}}" \
              --query 'Item.Info.S' --output text 2>/dev/null) || continue
            [ "$info" = "None" ] || [ -z "$info" ] && continue
            id=$(echo "$info" | jq -r .ID)
            who=$(echo "$info" | jq -r .Who)
            case "$who" in
              runner@*) ;;
              *) echo "  $layer is locked by $who, not by a runner — leaving it"; continue ;;
            esac
            echo "  releasing $layer ($id, held by $who)"
            terraform -chdir="infra/$layer" force-unlock -force "$id" || true
          done

      - name: confirm nothing survived
        # Two things this used to get wrong, and both made it useless in opposite directions.
        #
        # It filtered on `attestor:managed=terraform`, which `infra/bootstrap` also carries —
        # the state bucket, the lock table, its KMS key and three SSM parameters. Those are
        # supposed to survive; the comment at the bottom of this file says so. So the check
        # counted six resources it had just been told to leave alone, and could never pass,
        # on any teardown, however perfect.
        #
        # And the Resource Groups Tagging API is an index, not the truth. Straight after a
        # destroy it still lists resources that are gone — verified: it reported four Cognito
        # user pools while `list-user-pools` returned nothing at all. A check that reads a
        # lagging index once will cry wolf every time, and the cost of that is not the noise:
        # it is that nobody believes it on the day something really is left standing.
        #
        # So: only the four layers the destroy actually removes, and poll until the index
        # agrees. A real survivor never disappears from it, so this waits out lag without
        # waiting out a failure.
        run: |
          set -euo pipefail
          failed=0

          # 1. Terraform's own account of itself. Authoritative and immediate: a layer with an
          #    empty state manages nothing, and a resource it failed to delete stays in state.
          for layer in agent knowledge data foundation; do
            terraform -chdir="infra/$layer" init \
              -backend-config="bucket=$TF_STATE_BUCKET" \
              -backend-config="region=$AWS_REGION" \
              -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
              -backend-config="encrypt=true" >/dev/null 2>&1 || true
            remaining=$(terraform -chdir="infra/$layer" state list 2>/dev/null | wc -l | tr -d ' ')
            echo "  $layer: $remaining resource(s) in state"
            [ "$remaining" = "0" ] || failed=1
          done

          # 2. The three line items that would actually cost money if Terraform ever lost track
          #    of one. Asked of the services that own them, because those answer with the truth.
          collections=$(aws opensearchserverless list-collections \
            --query 'collectionSummaries[?starts_with(name, `attestor`)].name' --output text)
          nats=$(aws ec2 describe-nat-gateways \
            --filter Name=state,Values=available,pending \
            --query 'NatGateways[].NatGatewayId' --output text)
          endpoints=$(aws ec2 describe-vpc-endpoints \
            --query 'VpcEndpoints[?VpcEndpointType==`Interface`].VpcEndpointId' --output text)
          for label in "collections:$collections" "nat gateways:$nats" "vpc endpoints:$endpoints"; do
            values="${label#*:}"
            if [ -n "$values" ]; then
              echo "still standing — ${label%%:*}: $values" >&2
              failed=1
            fi
          done

          # 3. The tag index, for information only. It is an index rather than the truth and it
          #    keeps deleted resources for hours: after a clean teardown it listed four Cognito
          #    pools that `list-user-pools` could not find and a NAT gateway already in state
          #    `deleted`. Polling it for six minutes changed nothing, which is how this stopped
          #    being the check and became a footnote to it. Failing on a lagging index teaches
          #    people to ignore a red teardown, and that is worse than not looking.
          indexed=$(aws resourcegroupstaggingapi get-resources \
            --tag-filters Key=attestor:layer,Values=foundation,data,knowledge,agent \
            --query 'length(ResourceTagMappingList)' --output text)
          echo "  tag index still lists $indexed (lags by hours; not a verdict)"

          [ "$failed" = "0" ] || { echo "the estate did not fully go down" >&2; exit 1; }
          {
            echo "### Estate down"
            echo "Every layer's Terraform state is empty, and no OpenSearch collection, NAT"
            echo "gateway or interface endpoint remains. Bootstrap is untouched by design:"
            echo "state, locking and the deploy role outlive every estate."
          } >> "$GITHUB_STEP_SUMMARY"

      # infra/bootstrap is deliberately untouched: it holds the state and the identity this
      # workflow just used, and destroying it would leave no way to stand anything up again.
