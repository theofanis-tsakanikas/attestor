# Tearing the estate down. Typed confirmation, reverse dependency order, and a check that it
# actually went.
#
# The last step matters more than it looks: a destroy that fails halfway leaves the most
# expensive layer standing while the summary says "completed". Confirming emptiness is how
# "we destroyed it" stops being something we believe and becomes something we checked.

name: Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DESTROY to confirm
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: check the typed confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DESTROY" ]; then
            echo "confirmation not given" >&2
            exit 1
          fi

  destroy:
    needs: confirm
    runs-on: ubuntu-latest
    environment: destroy
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: empty the buckets
        # Versioned buckets refuse to delete while they hold objects, and `force_destroy`
        # covers current versions only. A teardown that stops here leaves the lake — the
        # thing actually holding a tenant's data — standing.
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -uo pipefail
          terraform -chdir=infra/foundation init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true" >/dev/null
          for output in lake_bucket evidence_bucket reports_bucket; do
            bucket=$(terraform -chdir=infra/foundation output -raw "$output" 2>/dev/null) || continue
            echo "── emptying $bucket"
            aws s3api delete-objects --bucket "$bucket" --delete "$(aws s3api list-object-versions \
              --bucket "$bucket" --output json \
              --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}')" 2>/dev/null || true
            aws s3api delete-objects --bucket "$bucket" --delete "$(aws s3api list-object-versions \
              --bucket "$bucket" --output json \
              --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}')" 2>/dev/null || true
          done

      - name: destroy in reverse order
        env:
          TF_VAR_expires_at: "1970-01-01"
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          TF_VAR_deploy_runtime: "true"
        run: |
          set -euo pipefail
          for layer in agent knowledge data foundation; do
            echo "── $layer"
            ./.github/scripts/tf.sh destroy "$layer"
          done

      - name: confirm nothing survived
        run: |
          set -euo pipefail
          survivors=$(aws resourcegroupstaggingapi get-resources \
            --tag-filters Key=attestor:managed,Values=terraform \
            --query 'length(ResourceTagMappingList)' --output text)
          echo "tagged resources remaining: $survivors"
          if [ "$survivors" != "0" ]; then
            echo "the estate did not fully go down" >&2
            aws resourcegroupstaggingapi get-resources \
              --tag-filters Key=attestor:managed,Values=terraform \
              --query 'ResourceTagMappingList[].ResourceARN' --output table
            exit 1
          fi
          echo "### Estate down — 0 tagged resources remain" >> "$GITHUB_STEP_SUMMARY"

      # infra/bootstrap is deliberately untouched: it holds the state and the identity this
      # workflow just used, and destroying it would leave no way to stand anything up again.
