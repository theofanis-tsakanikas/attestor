# Every pull request. No credentials, no cloud, no network beyond installing dependencies.
#
# That is not a limitation to apologise for — it is the design. Every claim this repository
# makes is checked here, on a runner with no AWS account, which is the same thing as saying a
# reviewer can check them on a laptop.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Deploy re-runs this whole file against the exact ref being deployed. Without
  # `workflow_call` the `uses: ./.github/workflows/ci.yml` in deploy.yml is not a reusable
  # workflow at all and the deploy fails before its first step — which is how a repository
  # ends up with a deploy path nobody has ever successfully started.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts pipelines
      - run: ruff format --check src tests scripts pipelines
      - run: pytest -q

  claims:
    name: the five claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: contracts are consistent
        run: attestor contracts validate

      - name: recordings match the queries
        # A query edited without re-capturing would replay a stale answer and every gate
        # below would pass against the previous version of the system.
        run: python scripts/seed_recordings.py --check

      - name: the seeded lake reproduces the recordings
        # The hinge between offline and live. If a generated total drifts from its recording,
        # the suite and the deployed system are testing different programs, and every claim
        # below becomes approximately true — which is the same as untrue.
        run: python pipelines/seed/generate.py --check

      - name: every document carries the metadata retrieval filters on
        # Bedrock evaluates the tenant filter against attributes it reads from a sidecar file.
        # A document without one is a document no filtered query can ever reach.
        run: python scripts/generate_kb_metadata.py --check
      - name: evidence manifests name only declared classes
        run: python pipelines/ingest/evidence.py

      - name: the regulatory corpus covers every datapoint
        # A datapoint with no corpus entry is a datapoint the model can never find guidance
        # for, and the failure is invisible: retrieval returns something, just not this.
        run: python pipelines/ingest/regulatory.py --check

      - name: the MCP tool schema matches the handlers
        # Terraform configures the gateway target from a committed file. A tool added to
        # SPECS without regenerating it is a handler the Gateway never exposes.
        run: attestor gateway spec --check

      - name: "claim 1 — indirect prompt injection"
        run: attestor eval injection

      - name: "claim 2 — tenant isolation"
        run: attestor eval isolation

      - name: "claim 3 — no number comes from an LLM"
        run: attestor gate provenance --all

      - name: "claim 4 — reproducible resolution"
        run: attestor eval reproducibility

      - name: "claim 5 — disciplined abstention"
        run: attestor eval abstention

      - name: authorization policies
        run: attestor policy verify

      - name: retrieval golden set
        run: attestor eval retrieval

      - name: governance docs are in sync with the code
        run: attestor govern generate --check

  gate-proof:
    name: attack our own gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Breaks every control on purpose and requires the real gate to refuse it, for the
      # right reason. A gate that has never been shown to fail is a comment.
      - run: python scripts/gate_proof.py

  overrides:
    name: override register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # An expired override turns this red. That is the mechanism, not a bug: nobody gets to
      # accept a defect permanently and quietly.
      - run: python scripts/check_overrides.py --warn-days 30

  infrastructure:
    name: terraform and checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: pip install -e ".[dev]"
      - run: terraform fmt -check -recursive infra
      - name: validate every layer against real provider schemas
        # `-backend=false`: no state, no credentials, nothing reached but the registry. This
        # is what catches an attribute that does not exist, and it is the difference between
        # "this should apply" and "this applies".
        run: python scripts/tf_validate.py
      - name: checkov
        # Zero findings. Every deliberate exception carries an inline reason next to the
        # resource it applies to — a suppression file nobody reads is how a scanner stops
        # meaning anything.
        run: checkov -d infra --compact --quiet
      - name: the container build context is complete
        run: python scripts/check_docker_context.py
      - name: Terraform, dbt and the queries agree on the lakehouse
        # `dbt parse` resolves sources against schema.yml, not against a catalogue, so seven
        # invented table names compiled cleanly for as long as nobody ran them.
        run: python scripts/check_lakehouse_wiring.py
      - name: the AgentCore policy set still holds its one rule
        # The engine is in the estate to keep `request_override` uncallable through the
        # gateway. A policy set that lost that forbid is a policy engine with nothing to say.
        run: python scripts/check_agentcore_policies.py
      - name: every AgentCore name is one AgentCore accepts
        # Provider attribute validators run in the plan phase, and a plan needs credentials.
        # Two deploys died fifteen minutes in on a hyphen this would have caught for free.
        run: python scripts/check_agentcore_names.py
      - name: every OIDC subject names this repository and an environment
        # CKV_AWS_358 above cannot parse GitHub's immutable subject and reads only the first
        # value of the list. This reads all of them and refuses any wildcard.
        run: python scripts/check_oidc_subjects.py
      - name: the lambda payload can actually be built
        # Not a formality. `make package` was green on every laptop and had never executed on
        # a runner, because the Makefile hard-coded `.venv/bin/pip`. It failed inside a deploy
        # instead — which is the expensive place, and the one this job exists to be cheaper
        # than. A packaging step that only CI-by-proxy covers is a packaging step nobody
        # covers.
        run: make package
      - name: the gateway target compromise is still justified
        # `infra/agent` attaches its tools with a provisioner because no provider has a
        # gateway-target resource. This turns red the day one ships, so the workaround is
        # removed by a failing build rather than by somebody remembering.
        run: python scripts/check_gateway_target.py
