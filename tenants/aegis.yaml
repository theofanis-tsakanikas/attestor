# Aegis Foods — the CSRD tenant that cannot issue.
#
# Its corpus is complete and its paperwork is in order; the defects are in the data. Two
# tenants in one vertical is what makes the isolation suite mean something: a leak between
# tenants running different standards could be explained away by a schema difference, and a
# leak between these two cannot.
id: aegis
name: Aegis Foods N.V.
standard: ESRS
periods: ["2026"]
reporting_contact: esg@aegisfoods.example

identity:
  kind: cognito
  # PLACEHOLDER. The real issuer contains a user-pool id Terraform generates, so it
  # cannot be written here. The deployed handler and runtime read
  # ATTESTOR_ISSUER_AEGIS, which `infra/agent` sets from the pool it created.
  #
  # This value is checked against a token's `iss`, so it is a control and not a note:
  # if the deployment forgets the variable, no real token matches and every request is
  # refused. That is the intended failure. What is *not* intended is what happened
  # before — this line said `eu-central-1_EXAMPLE`, read like a sample, and silently
  # made the whole AgentCore path unusable.
  issuer: https://cognito-idp.eu-central-1.amazonaws.com/eu-central-1_PLACEHOLDER_SET_BY_TERRAFORM
  audience: attestor-aegis
  groups_claim: "cognito:groups"
  role_map:
    aegis-esg: role:reporter
    aegis-esg-leads: role:preparer
    aegis-audit: role:auditor
