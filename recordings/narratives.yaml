  text: The system is a regulated-report production platform. Its intended purpose
    is to assemble sustainability and conformity documentation from an undertaking's
    own evidence corpus, under the supervision of a named preparer. [ev:11aa] The
    provider is the undertaking documented in the general disclosures, and the system
    is deployed as a hosted service reached through an authenticated session. [ev:22bb]
    The system interacts with a managed data lakehouse and a managed retrieval service
    that it is not itself part of; both are named in the system documentation. The
    documentation is silent on use outside the reporting workflow, and this file therefore
    makes no claim about such use.
