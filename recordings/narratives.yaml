  text: The undertaking has a transition plan for climate change mitigation covering
    its manufacturing sites and its agricultural supply base, approved by the board
    in the reporting period. [ev:4b1e] Its stated levers are refrigerant substitution,
    process heat recovery and supplier engagement on land use. [ev:c07d] The plan
    records that the supply-base lever depends on primary data the undertaking does
    not yet collect from all growers, and describes the programme intended to close
    that gap. [ev:ea55] The plan does not claim alignment with a recognised decarbonisation
    pathway for the reporting period.
