  text: The undertaking maintains a transition plan for climate change mitigation,
    approved by the board and reviewed by the sustainability committee within the
    reporting period. [ev:7f3a] The plan covers the undertaking's own operations and
    its upstream value chain, and names fleet replacement, site electrification and
    modal shift to rail as its principal decarbonisation levers. [ev:91c0] Capital
    allocation for those levers is sequenced against the approved capital plan, and
    the plan identifies which of them depend on charging and grid infrastructure the
    undertaking does not control. [ev:2d55] Board approval and the review cycle are
    evidenced in the minutes of the sustainability committee. Where the plan's alignment
    with limiting global warming has not yet been assessed against a recognised methodology,
    the plan states that rather than asserting an alignment it has not tested.
