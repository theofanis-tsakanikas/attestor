  - ev:33cc
  - ev:44dd
  text: Human oversight is exercised by the preparer who holds the session under which
    the system runs, and by the approvers named in the override register. [ev:33cc]
    The documented procedure states that the system refuses to issue a report while
    any datapoint is in a blocking state, and that the refusal can be lifted only
    by a signed, expiring override recorded outside the system. [ev:44dd] No automated
    principal may request, approve or classify such an override, and one class of
    failure admits no override at all. Every figure carries a lineage identifier that
    lets a reviewer reach the source records behind it, which is the technical measure
    that makes the output interpretable rather than merely readable.
