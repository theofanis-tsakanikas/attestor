[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attestor"
version = "0.1.0"
description = "Multi-tenant regulated report factory — every number carries its proof"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Theofanis Tsakanikas" }]
keywords = ["responsible-ai", "rag", "bedrock", "agentcore", "csrd", "esrs", "eu-ai-act"]

# `jsonschema` used to be here and was imported by nothing. It shipped in the Lambda payload
# and in the container for no reason — and it contradicted the position this project actually
# takes, which is that `contracts/model.py` *is* the schema and a second description of one
# contract diverges on the first busy afternoon. `tests/test_dependencies.py` fails if a
# declared dependency stops being imported.
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "typer>=0.12",
    "rich>=13.9",
]

[project.optional-dependencies]
# Cloud clients are NOT a hard dependency: the whole test suite, every eval and every gate
# run without them. Installing this extra is only needed to talk to a live estate.
cloud = [
    # 1.40, not 1.35. The `bedrock-agentcore` data plane — which is how anything writes to
    # AgentCore Memory — does not exist in botocore before it, and `boto3.client(...)` on an
    # unknown service raises `UnknownServiceError` at call time rather than at import. A floor
    # that is too low here is a memory layer that is deployed, encrypted, retained, and
    # unwritable.
    "boto3>=1.40",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    # Pillow arrives anyway as a python-pptx dependency, and `scripts/mask_account_id.py`
    # was written against it on that basis. Declared here because a preflight check that
    # only runs when some *other* package happens to still want its dependency is a check
    # that will go quiet without anybody noticing.
    "pillow>=10.0",
    # checkov is deliberately absent, and this is the note that keeps it absent. It pins
    # `boto3==1.35.49` exactly, in every release including the newest, and `bedrock-agentcore`
    # — the API AgentCore Memory is written through — does not exist in botocore that old. One
    # of the two had to leave the environment, and a scanner is a tool while boto3 is the
    # application. It is installed on its own in CI and in `make iac-scan`; the scan itself is
    # unchanged and still gates every push.
]

[project.scripts]
attestor = "attestor.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/attestor"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PL", "S"]
ignore = [
    "PLR0913", # a resolver legitimately takes many explicit inputs
    "S101",    # assert is how tests assert
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S105", "S106"]
"evals/**" = ["PLR2004"]
# The expression walkers are exhaustive `match` statements over a whitelisted AST. Each arm
# returns; collapsing them into fewer returns would hide which node types are handled, which
# is the one thing a reader of a safe-evaluation whitelist needs to see at a glance.
"src/attestor/contracts/derivation.py" = ["PLR0911"]
# `_resolve_one` dispatches one branch per resolver kind and returns from each. Folding
# them together would hide which kinds exist, which is the first thing a reader needs.
"src/attestor/datapoints/resolver.py" = ["PLR0911"]
# The render helpers thread the same five collaborators (results, contracts, context,
# manifest, template) through every level. Bundling them into a context object would hide
# which of them a given step is allowed to touch, and that visibility is the point.
"src/attestor/documents/render.py" = ["PLR0917"]
# Typer declares options as argument defaults. That is the framework's calling convention,
# not a mutable-default bug.
"src/attestor/cli/main.py" = ["B008"]
# `×` and `›` are the characters these strings mean. Substituting `x` and `>` would make a
# heading path and a unit product read as something else.
"src/attestor/retrieval/chunking.py" = ["RUF001"]
"src/attestor/retrieval/kb.py" = ["RUF001"]
"src/attestor/observability/governance.py" = ["RUF001"]
# The dashboard embeds a CSS block as a string literal. Wrapping stylesheet declarations to
# satisfy a Python line limit makes the CSS harder to read and the Python no easier.
"src/attestor/observability/dashboard.py" = ["E501"]
# The preflight and validate scripts shell out to `terraform`, `make` and `git` by name. A
# hardcoded absolute path would be wrong on every machine but the one that wrote it, and the
# commands are fixed literals with no user input anywhere near them.
"scripts/preflight.py" = ["S607"]
"scripts/check_gateway_target.py" = ["S607"]
"scripts/tf_validate.py" = ["S607"]
"scripts/check_docker_context.py" = ["S607"]
"tests/retrieval/test_chunking_and_bakeoff.py" = ["RUF001"]
# The confusable characters *are* the test. A Cyrillic `З` where a `3` belongs is the
# canonical OCR misread, and substituting the Latin digit would assert that the parser
# handles a string it will never be given.
"tests/datapoints/test_extraction.py" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gate: exercises a CI-enforced acceptance gate",
    "eval: scores a labelled corpus (credential-free)",
    "slow: takes more than a second",
]

[tool.coverage.run]
source = ["src/attestor"]
branch = true
