# Evidence corpus manifest — tenant `lumen`, monitoring period 2026.
#
# The AI system documented here is **Attestor itself**. That is not a joke about
# recursion: a platform that produces conformity documentation for other people's AI
# systems and cannot produce its own is making a claim it has not tested. The evidence
# below is this repository — its evaluation harnesses, its risk register, its oversight
# procedure — and the first technical file it issues is about the thing issuing it.
#
# The evaluation report and the data sheet are **generated**, by `attestor evidence
# export`, from the harnesses they describe. Every figure in them is a return value of
# a run rather than a claim about one, and `--check` fails the build when they drift.
# That is what makes the paragraph above a statement rather than an aspiration.
#
# The model card, the system documentation and the oversight procedures remain written
# by hand. They are descriptions of design, not measurements, and there is nothing to
# generate them from; they correspond to ADR-0001 and to the override register.
#
# `content_sha256` is now reconciled against the bytes, for every document whose bytes
# are in this repository. It was not, and three of them digested to some earlier draft
# — a field whose whole purpose is that an auditor re-reads the same bytes, holding a
# hash of nothing in particular. The risk-register and incident extracts stay in S3
# because they are dumps of lake tables; `attestor evidence export` reports them as
# unverifiable here rather than skipping them quietly.

